# Production-like stack for trying the Docker image locally:
#   cp .env.example .env.docker   # then set APP_KEY (php artisan key:generate --show)
#   docker compose up --build
# The site is served at http://localhost:8080.

x-app: &app
  build: .
  env_file: .env.docker
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: http://localhost:8080
    DB_CONNECTION: pgsql
    DB_HOST: pgsql
    DB_PORT: 5432
    DB_DATABASE: codingsols
    DB_USERNAME: codingsols
    DB_PASSWORD: secret
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    CACHE_STORE: database
  depends_on:
    pgsql:
      condition: service_healthy

services:
  web:
    <<: *app
    ports:
      - "8080:8080"

  worker:
    <<: *app
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_DATABASE: codingsols
      DB_USERNAME: codingsols
      DB_PASSWORD: secret
      QUEUE_CONNECTION: database
    depends_on:
      web:
        condition: service_started

  scheduler:
    <<: *app
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: "false"
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_DATABASE: codingsols
      DB_USERNAME: codingsols
      DB_PASSWORD: secret
    depends_on:
      web:
        condition: service_started

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: codingsols
      POSTGRES_USER: codingsols
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codingsols -d codingsols"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgsql-data:
